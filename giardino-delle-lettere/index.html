@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--carta:#fffaf4}}
:root[data-theme="dark"]{--carta:#fffaf4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--carta);color:var(--testo);font-family:"Baloo 2","Arial Rounded MT Bold",Arial,sans-serif}
button{font-family:inherit;color:inherit}
#sfondo{position:fixed;inset:0;background:var(--sfondo) center/cover no-repeat;transition:filter 1.2s}
#sfondo.calmo{filter:blur(3px) brightness(1.12) saturate(.5) opacity(.55)}
#velo{position:fixed;inset:0;background:rgba(255,250,244,.0);transition:background .8s;pointer-events:none}
#velo.calmo{background:rgba(255,250,244,.55)}
.schermo{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;padding:12px 16px}
.schermo.su{display:flex}
.titolo{font-size:clamp(38px,6.5vw,78px);font-weight:800;line-height:1;text-align:center;color:#fff;-webkit-text-stroke:2px var(--bordo);paint-order:stroke fill;text-shadow:0 4px 0 var(--rosa),0 0 24px rgba(247,168,196,.8)}
.morbido{background:rgba(255,250,244,.88);border:3px solid #fff;border-radius:28px;box-shadow:0 8px 30px var(--ombra)}

/* INIZIO */
#inizio{justify-content:center;gap:3vh}
#inizio .fata{height:min(52vh,460px);filter:drop-shadow(0 10px 24px var(--ombra));animation:fluttua 4s ease-in-out infinite}
.gioca{width:clamp(150px,22vw,210px);height:clamp(150px,22vw,210px);border-radius:50%;border:8px solid #fff;background:radial-gradient(circle at 35% 30%,#ffe3ee,var(--rosa) 55%,#e58aae);color:#fff;font:800 clamp(32px,4.6vw,48px)/1 "Baloo 2",Arial,sans-serif;-webkit-text-stroke:1.5px var(--bordo);paint-order:stroke fill;box-shadow:0 0 0 6px var(--lilla),0 12px 30px var(--ombra);cursor:pointer;animation:respira 3s ease-in-out infinite}

/* GIARDINO (mappa) */
#mappa{gap:1.2vh;overflow-y:auto}
#mappa .titolo{font-size:clamp(30px,4.6vw,54px);margin:.5vh 0 .6vh;cursor:pointer;position:relative;z-index:3}
#prato{position:relative;width:min(1100px,96vw);min-height:min(56vh,480px);border-radius:34px;overflow:hidden;border:5px solid #fff;box-shadow:0 10px 30px var(--ombra)}
#pratoSfondo{position:absolute;inset:0;background:var(--sfondo) center/cover;transition:filter 1.5s}
#aiuole{position:relative;z-index:2;display:flex;flex-direction:column;gap:clamp(8px,1.6vh,16px);padding:14px;align-items:center}
.filare{display:flex;gap:clamp(8px,1.4vw,16px);flex-wrap:wrap;justify-content:center}
.aiuola{width:clamp(60px,7.4vw,84px);height:clamp(60px,7.4vw,84px);border-radius:50% 50% 46% 46%;border:4px solid #fff;font:800 clamp(28px,3.8vw,42px)/1 "Baloo 2",Arial,sans-serif;background:rgba(235,232,238,.92);color:#9d95a6;box-shadow:0 6px 0 rgba(122,95,150,.25);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.aiuola.fatta{background:radial-gradient(circle at 40% 35%,#fff,var(--c,#f7a8c4));color:var(--testo)}
.aiuola.ora{background:radial-gradient(circle at 40% 35%,#fff,var(--rosa));color:var(--testo);box-shadow:0 0 0 5px #fff,0 0 0 10px var(--lilla),0 0 30px var(--rosa);animation:respira 2.4s ease-in-out infinite}
.aiuola.chiusa{opacity:.55;cursor:default}
.aiuola.sicura::after{content:"✓";position:absolute;right:-6px;top:-6px;width:24px;height:24px;border-radius:50%;background:var(--foglia);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.piantato{position:absolute;z-index:1;width:clamp(40px,5vw,62px);transform:translate(-50%,-90%);pointer-events:none;animation:ondeggia 4s ease-in-out infinite;transform-origin:bottom center}
.piantato.danza{animation:danza .6s ease-in-out infinite alternate}
.barretta{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.tasto{font:800 clamp(18px,2.2vw,24px)/1 "Baloo 2",Arial,sans-serif;background:#fff;border:4px solid var(--lilla);border-radius:24px;padding:10px 20px;cursor:pointer;box-shadow:0 5px 0 rgba(122,95,150,.2)}
#tavolozze{display:flex;gap:8px;align-items:center;padding:6px 14px}
.tav{width:46px;height:46px;border-radius:50%;border:4px solid #fff;cursor:pointer;box-shadow:0 3px 8px var(--ombra)}
.tav.scelta{box-shadow:0 0 0 4px var(--lilla)}
.tav.chiusa{opacity:.25;cursor:default;filter:grayscale(1)}
#nota{font-size:clamp(15px,1.8vw,19px);color:var(--tenue);text-align:center}

/* ESERCIZIO */
#barra{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;z-index:5}
#progresso{flex:1;max-width:420px;height:20px;border-radius:12px;background:rgba(255,255,255,.8);border:3px solid #fff;overflow:hidden;box-shadow:0 2px 8px var(--ombra)}
#progresso div{height:100%;width:0;background:linear-gradient(90deg,var(--rosa),var(--lilla),var(--menta));transition:width .5s}
#stelle{font-size:26px;font-weight:800;background:#fff;border:3px solid var(--oro);border-radius:30px;padding:2px 16px;display:flex;align-items:center;gap:6px}
#stelle svg{width:26px;height:26px}
#stelle.pop{animation:pop .5s}
.piccolo{width:52px;height:52px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.9);font-size:23px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px var(--ombra)}
.gruppo{display:flex;gap:8px}
#cartello{margin-top:.8vh;padding:4px 26px;font-size:clamp(20px,2.8vw,30px);font-weight:800;text-align:center;max-width:92vw;z-index:4}
#domanda{min-height:24vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;margin:1.4vh 0 1vh;z-index:4;max-width:96vw}
.riga{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
#risposte{display:flex;gap:clamp(12px,2.4vw,28px);justify-content:center;flex-wrap:wrap;z-index:4;padding-left:clamp(0px,15vw,220px);min-height:10vh}
.carta{position:relative;width:clamp(124px,17vw,190px);height:clamp(124px,17vw,190px);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s,opacity .4s;color:var(--testo)}
.carta>.petali{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 6px 10px var(--ombra))}
.carta>.testo{position:relative;font-size:clamp(46px,6.4vw,78px);font-weight:800;line-height:1;width:58%;height:58%;border-radius:50%;background:#fffbe9;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -4px 0 rgba(242,198,90,.35)}
.carta.tavolozza{height:auto;min-height:clamp(140px,19vw,210px);border-radius:46% 54% 50% 50% / 52% 48% 52% 48%;background:#fff;border:5px solid var(--lilla);box-shadow:0 8px 20px var(--ombra);padding:10px}
.carta.tavolozza::before{content:"";position:absolute;width:20px;height:20px;border-radius:50%;left:16%;top:62%;background:var(--carta);box-shadow:inset 0 2px 4px var(--ombra)}
.carta.tavolozza svg{width:72%;max-height:120px}
.carta .parola{font-size:clamp(15px,2vw,24px);font-weight:800;text-align:center}
.carta.giusta{transform:scale(1.08)}
.carta.giusta>.petali{animation:sboccia .8s ease-out}
.carta.tavolozza.giusta{border-color:var(--oro);box-shadow:0 0 0 6px #fff7d6,0 0 30px var(--oro)}
.carta.sbagliata{animation:scuoti .45s;opacity:.35;pointer-events:none}
.carta.premuta{transform:scale(.92)}
.letterona{font-size:clamp(120px,20vw,220px);font-weight:800;line-height:.9;color:#fff;-webkit-text-stroke:4px var(--bordo);paint-order:stroke fill;text-shadow:0 6px 0 var(--rosa)}
.grande{width:clamp(120px,17vw,190px);height:auto;filter:drop-shadow(0 8px 14px var(--ombra))}
.frase{font-size:clamp(26px,4vw,46px);font-weight:800;padding:6px 26px;text-align:center;line-height:1.25;max-width:92vw}
.dipinta{width:min(40vh,300px);height:min(40vh,300px)}
.dipinta path{fill:none;stroke-linecap:round;stroke-linejoin:round}
#ascolta{position:fixed;right:16px;bottom:16px;z-index:8;width:84px;height:84px;border-radius:50%;border:5px solid #fff;background:radial-gradient(circle at 35% 30%,#e6f4ff,var(--cielo));font-size:38px;cursor:pointer;box-shadow:0 6px 20px var(--ombra);display:none}
#ascolta.su{display:block}
#avanti{font:800 clamp(24px,3.4vw,38px)/1 "Baloo 2",Arial,sans-serif;background:linear-gradient(180deg,#d9f5e8,var(--menta));border:5px solid #fff;border-radius:40px;padding:12px 38px;box-shadow:0 6px 0 rgba(90,150,120,.35);cursor:pointer;display:none;z-index:8;margin-top:1vh}
#avanti.su{display:inline-block;animation:respira 2.4s infinite}
#guida{position:fixed;left:-1vw;bottom:0;height:min(42vh,400px);z-index:6;transform-origin:bottom center;pointer-events:none;filter:drop-shadow(0 8px 18px var(--ombra))}
#guida.indica{animation:indica 1.4s ease-in-out infinite}
#fumetto{position:fixed;left:clamp(150px,19vw,290px);bottom:min(32vh,310px);background:#fff;font-size:clamp(18px,2.2vw,25px);font-weight:800;border-radius:22px;padding:8px 18px;z-index:7;opacity:0;transform:scale(.6);transition:all .35s;max-width:40vw;border:4px solid var(--lilla)}
#fumetto.su{opacity:1;transform:scale(1)}
#mano{position:fixed;width:90px;height:90px;z-index:30;pointer-events:none;opacity:0;transition:left 1.2s ease-in-out,top 1.2s ease-in-out,opacity .3s;left:12vw;top:70vh;filter:drop-shadow(0 6px 8px var(--ombra))}
#mano.tocca{animation:tocca .5s 2}

/* traccia = pittura */
#tracciaBox{position:relative;width:min(52vh,78vw,480px);aspect-ratio:1;background:#fffdf8;border:5px solid #fff;border-radius:30px;box-shadow:0 8px 30px var(--ombra);touch-action:none}
#tracciaBox canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:26px;touch-action:none}
#tracciaBox.accesa{box-shadow:0 0 0 8px #fff7d6,0 0 50px var(--oro)}
.rifai{position:absolute;right:-68px;top:0;width:56px;height:56px;border-radius:50%;border:4px solid #fff;background:var(--lilla);font-size:26px;cursor:pointer}
#colori{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.colore{width:clamp(44px,5.4vw,58px);height:clamp(44px,5.4vw,58px);border-radius:50%;border:4px solid #fff;cursor:pointer;box-shadow:0 3px 8px var(--ombra)}
.colore.scelto{box-shadow:0 0 0 5px var(--testo);transform:scale(1.1)}
@media (max-width:700px){.rifai{right:0;top:-66px}#risposte{padding-left:0}#guida{height:26vh;opacity:.92}#fumetto{bottom:21vh;left:30vw;max-width:64vw}}

/* premi */
#festa{position:fixed;inset:0;z-index:15;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(circle at 50% 70%,rgba(255,240,247,.85),rgba(255,250,244,0) 70%)}
#festa.su{opacity:1}
#festa img{height:min(62vh,520px);animation:danzaFata 1s ease-in-out infinite alternate;filter:drop-shadow(0 10px 24px var(--ombra))}
#festa .brava{position:absolute;top:13vh;font-size:clamp(50px,8vw,100px);font-weight:800;color:#fff;-webkit-text-stroke:2.5px var(--bordo);paint-order:stroke fill;text-shadow:0 6px 0 var(--rosa)}
.petalo{position:fixed;top:-60px;z-index:16;pointer-events:none;animation:cadeDolce linear forwards}
.sovra{position:fixed;inset:0;z-index:25;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;background:rgba(255,250,244,.93);text-align:center;padding:16px}
.sovra.su{display:flex}
.sovra h2{font-size:clamp(34px,5vw,62px);margin:0;color:#fff;-webkit-text-stroke:2px var(--bordo);paint-order:stroke fill;text-shadow:0 5px 0 var(--rosa);line-height:1.05}
.sovra p{font-size:clamp(20px,2.8vw,30px);margin:0;font-weight:600}
.sovra img.fata{height:min(36vh,320px);animation:danzaFata 1s ease-in-out infinite alternate}
.btn{font:800 clamp(24px,3.4vw,40px)/1 "Baloo 2",Arial,sans-serif;color:#fff;-webkit-text-stroke:1px var(--bordo);paint-order:stroke fill;background:linear-gradient(180deg,#ffd6e6,var(--rosa));border:6px solid #fff;border-radius:40px;padding:14px 40px;box-shadow:0 0 0 5px var(--lilla),0 10px 24px var(--ombra);cursor:pointer}
.premi{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.premio{background:#fff;border:3px solid var(--lilla);border-radius:20px;padding:6px 16px;font-size:clamp(17px,2.2vw,24px);font-weight:800}
#pianta .scelte{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.tipofiore{width:84px;height:84px;border-radius:24px;border:4px solid #fff;background:#fff;cursor:pointer;box-shadow:0 4px 10px var(--ombra)}
.tipofiore.scelto{box-shadow:0 0 0 5px var(--lilla)}
#miniPrato{position:relative;width:min(760px,92vw);height:min(34vh,280px);border-radius:26px;overflow:hidden;border:5px solid #fff;box-shadow:0 8px 24px var(--ombra);cursor:crosshair}
#miniPrato .sf{position:absolute;inset:0;background:var(--sfondo) center/cover}
/* memory e abbina colori */
.griglia3{display:grid;grid-template-columns:repeat(3,clamp(90px,14vw,140px));gap:14px}
.mcarta{aspect-ratio:3/4;border-radius:22px;border:5px solid #fff;background:linear-gradient(135deg,var(--rosa),var(--lilla));display:flex;align-items:center;justify-content:center;cursor:pointer;font:800 clamp(44px,6vw,70px)/1 "Baloo 2",Arial,sans-serif;color:transparent;box-shadow:0 6px 14px var(--ombra)}
.mcarta>*{display:none}
.mcarta.dietro::before{content:"🌸";font-size:44px;color:initial}
.mcarta.su{background:#fff;color:var(--testo)}
.mcarta.su>*{display:block}
.mcarta.su::before{content:none}
.mcarta.presa{box-shadow:0 0 0 5px var(--oro),0 0 24px var(--oro);background:#fffbe9;color:var(--testo)}
.mcarta.presa>*{display:block}
.mcarta .tondo{width:70%;aspect-ratio:1;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 8px var(--ombra)}
.mcarta svg{width:80%}
/* album da colorare */
#album .griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;width:min(900px,92vw);max-height:58vh;overflow:auto;padding:6px}
.pagina{border-radius:18px;border:4px solid #fff;background:#fff;padding:6px;display:flex;flex-direction:column;align-items:center;font:800 32px/1 "Baloo 2",Arial,sans-serif;box-shadow:0 4px 10px var(--ombra);cursor:pointer;position:relative}
.pagina .mini{width:72px;height:72px;position:relative}
.pagina .mini svg,.pagina .mini img{position:absolute;inset:0;width:100%;height:100%}
.pagina.chiusa{opacity:.35;cursor:default;filter:grayscale(1)}
.pagina small{font-size:13px;font-weight:600}
#colora .tela{position:relative;width:min(58vh,86vw,520px);aspect-ratio:1;background:#fff;border-radius:26px;border:5px solid #fff;box-shadow:0 8px 24px var(--ombra);overflow:hidden;touch-action:none}
#colora .tela svg.stampo{position:absolute;inset:8%;width:84%;height:84%;opacity:.28;filter:grayscale(1)}
#colora canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.attrezzi{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.attrezzo{width:56px;height:56px;border-radius:18px;border:4px solid #fff;background:#fff;font-size:28px;cursor:pointer;box-shadow:0 3px 8px var(--ombra)}
.attrezzo.scelto{box-shadow:0 0 0 4px var(--lilla)}
/* respiro dei fiori */
#respiro svg{width:min(44vh,320px);height:min(44vh,320px);animation:respiroFiore 5s ease-in-out infinite}
#respiroTxt{font-size:clamp(30px,4.6vw,52px);font-weight:800;color:var(--bordo)}
/* genitori */
#genitore{position:fixed;inset:0;z-index:40;display:none;background:#faf7ff;color:#2d2140;overflow:auto;padding:20px 16px;font-family:Arial,sans-serif}
#genitore.su{display:block}
#genitore h2{margin:0 0 8px;font-size:26px}#genitore h3{margin:18px 0 6px;font-size:19px}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;max-width:760px}
.gcella{border-radius:12px;padding:8px;font-size:14px;border:2px solid #0002}.gcella b{font-size:28px;display:block}
.gcella.verde{background:#c9f5df}.gcella.giallo{background:#fff1b8}.gcella.rosso{background:#ffd9e8}.gcella.grigio{background:#eee;color:#888}
#genitore button{font-size:17px;padding:8px 16px;border-radius:10px;border:2px solid #7b5fb0;background:#fff;color:#4b2f80;cursor:pointer;margin:12px 8px 0 0}

@keyframes respira{50%{transform:scale(1.06)}}
@keyframes fluttua{50%{transform:translateY(-12px) rotate(1deg)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes sboccia{0%{transform:scale(.6) rotate(-30deg)}70%{transform:scale(1.12) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
@keyframes scuoti{20%{transform:translateX(-12px) rotate(-3deg)}40%{transform:translateX(10px) rotate(3deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes ondeggia{0%,100%{transform:translate(-50%,-90%) rotate(-3deg)}50%{transform:translate(-50%,-90%) rotate(3deg)}}
@keyframes danza{0%{transform:translate(-50%,-90%) rotate(-12deg) scale(1)}100%{transform:translate(-50%,-100%) rotate(12deg) scale(1.15)}}
@keyframes danzaFata{0%{transform:translateY(0) rotate(-3deg)}100%{transform:translateY(-18px) rotate(3deg)}}
@keyframes indica{0%,100%{transform:rotate(0)}50%{transform:rotate(4deg) translateX(8px)}}
@keyframes tocca{50%{transform:scale(.8) translateY(8px)}}
@keyframes cadeDolce{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(115vh) translateX(60px) rotate(540deg)}}
@keyframes respiroFiore{0%,100%{transform:scale(.62)}50%{transform:scale(1.08)}}
@keyframes disegna{to{stroke-dashoffset:0}}
</style>

<script>
/* =========================================================
   IL GIARDINO DELLE LETTERE - stesso metodo del Tour delle Lettere,
   mondo d'artista: fiori, colori, pittura e danza
   ========================================================= */
const $ = id => document.getElementById(id);
const attendi = ms => new Promise(r => setTimeout(r, ms));
const mescola = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pesca = (a, n, esclusi = []) => mescola(a.filter(x => !esclusi.includes(x))).slice(0, n);
const icona = (k, cls = "") => `<svg class="${cls}" viewBox="0 0 120 120"><use href="#i-${k}"/></svg>`;

/* ---------- PAROLE E LETTERE (come nel Tour delle Lettere) ---------- */
const P = {
  mela:{s:["ME","LA"]}, luna:{s:["LU","NA"]}, sole:{s:["SO","LE"]}, rosa:{s:["RO","SA"]}, nave:{s:["NA","VE"]},
  casa:{s:["CA","SA"]}, dado:{s:["DA","DO"]}, palla:{s:["PAL","LA"]}, torta:{s:["TOR","TA"]}, ballo:{s:["BAL","LO"]},
  ape:{s:["A","PE"]}, elefante:{s:["E","LE","FAN","TE"]}, isola:{s:["I","SO","LA"]}, orso:{s:["OR","SO"]}, uva:{s:["U","VA"]},
  fiore:{s:["FIO","RE"]}, gatto:{s:["GAT","TO"]}, vaso:{s:["VA","SO"]}, zaino:{s:["ZAI","NO"]}
};
const nome = k => P[k].s.join("");
const LETTERE = [
  { l:"A", v:true, parola:"ape",      simili:["H","V"] }, { l:"E", v:true, parola:"elefante", simili:["F","B"] },
  { l:"I", v:true, parola:"isola",    simili:["L","T"] }, { l:"O", v:true, parola:"orso",     simili:["Q","C"] },
  { l:"U", v:true, parola:"uva",      simili:["V","N"] },
  { l:"M", parola:"mela",  simili:["N","W"] }, { l:"L", parola:"luna",  simili:["I","T"] }, { l:"S", parola:"sole",  simili:["Z","C"] },
  { l:"R", parola:"rosa",  simili:["P","B"] }, { l:"N", parola:"nave",  simili:["M","Z"] }, { l:"F", parola:"fiore", simili:["E","P"] },
  { l:"P", parola:"palla", simili:["R","B"] }, { l:"T", parola:"torta", simili:["I","L"] }, { l:"B", parola:"ballo", simili:["D","R"] },
  { l:"D", parola:"dado",  simili:["B","O"] }, { l:"C", parola:"casa",  simili:["G","O"] }, { l:"G", parola:"gatto", simili:["C","O"] },
  { l:"V", parola:"vaso",  simili:["U","A"] }, { l:"Z", parola:"zaino", simili:["S","N"] }
];
const DIVERSE = ["A","E","I","O","U","M","L","S","R","N","F","P","T","B","D","C","G","V","Z","H","K","X","Y","W","Q","J"];
const LET = Object.fromEntries(LETTERE.map(x => [x.l, x]));
const suonoTesto = l => LET[l].v ? l.toLowerCase() + "!" : ["A","E","I"].map(v => (l + v).toLowerCase()).join(", ");
const parolaTesto = l => nome(LET[l].parola).toLowerCase();

/* ---------- TAVOLOZZE (una nuova ogni 5 lettere) ---------- */
const TAVOLOZZE = [
  { nome:"Primavera", colori:["#f7a8c4","#c9b6f2","#a8e0c8","#ffd59e","#a9d6f5","#ffb8a8"] },
  { nome:"Tramonto",  colori:["#ffb38a","#ff9aa2","#f6c177","#e8a0bf","#c39bd3","#ffd6a5"] },
  { nome:"Mare",      colori:["#8ed1fc","#7fc8c0","#b5e2fa","#a0c4ff","#9bf6ff","#cdb4db"] },
  { nome:"Bosco",     colori:["#9fd4a6","#c8e6a0","#e9c46a","#d4a373","#b5c99a","#f2cc8f"] },
  { nome:"Arcobaleno pastello", colori:["#ffadad","#ffd6a5","#fdffb6","#caffbf","#9bf6ff","#bdb2ff"] }
];
const tavoleAperte = () => Math.min(TAVOLOZZE.length, 1 + Math.floor(S.tappa / 5));
const tav = () => TAVOLOZZE[Math.min(S.tavola, tavoleAperte() - 1)];
const SOGLIA = 0.8, PAUSA_MIN = 11;

/* ---------- SALVATAGGIO (separato dal Tour delle Lettere) ---------- */
const CHIAVE = "giardino-delle-lettere-v1";
const nuovoStato = () => ({ tappa:0, tavola:0, stelle:0, risultati:{}, stat:{}, lett:{}, fiori:[], disegni:{} });
let S = nuovoStato();
const USA_DISEGNI = true, PREFISSO = "GIAR1";

      if (sentiti === null) return;                       /* microfono non disponibile: si gioca come prima */
      const esito = giudica(sentiti, b); st.prove++;
      if (esito === "giusto") { st.giuste++; if (bersagli.length === 1 || b === bersagli[bersagli.length - 1]) await parla(["Brava, l'hai detto benissimo!", "Perfetto!", "Che bella voce!"][st.giuste % 3]); break; }
      if (tentativo === 2) { await parla(esito === "silenzio" ? "Va bene, andiamo avanti!" : "Brava! Lo ripeteremo ancora più avanti."); return; }
      if (esito === "silenzio") await parla("Non ti ho sentita. Prova a dirlo più forte!");

  cd.addEventListener("pointerdown", e => { if (bloccato || tr.finito) return; cd.setPointerCapture(e.pointerId); tr.giu = true; tr.ultimo = pos(e); clearTimeout(timerAiuto); });

}

    g.setLineDash([2 * k, 4 * k]); g.strokeStyle = "rgba(122,95,150,.55)"; g.lineWidth = 1.2 * k; g.stroke(); g.setLineDash([]); });
  tratti.forEach((t, n) => {

/* ---------- PAUSA: il respiro dei fiori (20 secondi) ---------- */
async function respiroDeiFiori(){
  zitto(); fermaMusica(); $("respiro").classList.add("su"); $("riprendi").style.visibility = "hidden";
  await parla("Facciamo una pausa. Respira insieme al fiore.");
  for (let i = 0; i < 4; i++) { $("respiroTxt").textContent = "Inspira…"; parla("Inspira", { rate: .7 }); await attendi(2500); $("respiroTxt").textContent = "Espira…"; parla("Espira", { rate: .7 }); await attendi(2500); }
  $("respiroTxt").textContent = "Brava 🌸"; $("riprendi").style.visibility = "visible"; parla("Brava. Quando vuoi, si continua.");
}
$("riprendi").addEventListener("click", () => { $("respiro").classList.remove("su"); tInizio = Date.now(); prossimo(); });

/* ---------- COMANDI ---------- */
$("casa").addEventListener("click", () => { turno++; risolvi = null; disegnaGiardino(); });
$("audio").addEventListener("click", () => { audioOn = !audioOn; $("audio").textContent = audioOn ? "🔊" : "🔇"; if (!audioOn) zitto(); });
const toggleMusica = () => { musicaOn = !musicaOn; ["musica","musicaM"].forEach(id => $(id).textContent = musicaOn ? "🎵" : "🔕"); if (musicaOn && $("mappa").classList.contains("su")) avviaMusica(); else fermaMusica(); };
$("musica").addEventListener("click", toggleMusica); $("musicaM").addEventListener("click", toggleMusica);
$("gioca").addEventListener("click", () => {
  if (inCorso) return; inCorso = true; try { canale && canale.postMessage("avvio"); } catch(e) {}
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch(e) {}
  scegliVoce(); tInizio = Date.now();
  parla("Ciao! Benvenuta nel Giardino delle Lettere!"); disegnaGiardino();
});
$("guida").src = $("fataInizio").src; $("premioImg").src = $("festaImg").src;
(() => { const g = Math.max(0, 1 - S.tappa / LETTERE.length); $("sfondo").style.filter = `grayscale(${g.toFixed(2)})`; })();

</script>

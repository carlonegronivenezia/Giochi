<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Giochi di Cecilia</title>
<style>
:root{--sfondo:#fff6fb;--testo:#3a1d4d;--a:#ff5fa8;--b:#7b5cff}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px 16px;box-sizing:border-box;background:var(--sfondo);color:var(--testo);font-family:-apple-system,"Arial Rounded MT Bold",Arial,sans-serif}
h1{margin:0 0 8px;font-size:30px;text-align:center}
a{display:block;width:100%;max-width:380px;padding:26px 20px;border-radius:24px;color:#fff;text-decoration:none;font-size:24px;font-weight:800;text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.15)}
.tour{background:linear-gradient(135deg,var(--b),#2f7bff)}
.giardino{background:linear-gradient(135deg,var(--a),#ffb36b)}
</style>
</head>
<body>
<h1>I giochi di Cecilia</h1>
<a class="tour" href="tour-delle-lettere/">⭐ Tour delle Lettere</a>
<a class="giardino" href="giardino-delle-lettere/">🌸 Giardino delle Lettere</a>
</body>
</html>
